# Local development / demo stack.
#   cp .env.example .env   (then edit the secrets)
#   docker compose up -d --build
#   docker compose run --rm api python -m app.cli demo
#   docker compose run --rm api python -m app.cli simulate-stream --rate 20 --seconds 120   (live traffic)
# Open http://localhost:8080
name: fraud-detection-engine

x-backend-env: &backend_env
  FDE_DATABASE_URL: postgresql+psycopg://fde:${POSTGRES_PASSWORD}@db:5432/fde
  FDE_KAFKA_BOOTSTRAP: kafka:9092
  FDE_STREAMING_ENABLED: "true"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fde
      POSTGRES_USER: fde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fde -d fde"]
      interval: 5s
      retries: 10
    ports: ["127.0.0.1:5435:5432"]  # localhost only

  # Single-node Apache Kafka in KRaft mode (no ZooKeeper) — the same mode Amazon MSK runs.
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"  # topics are created explicitly by kafka-init
    volumes: [kafkadata:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      retries: 12
    ports: ["127.0.0.1:9094:9094"]  # for running the scorer or simulator from the host

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.raw --partitions 6 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.scored --partitions 6 --replication-factor 1 --config retention.ms=604800000
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.dlq --partitions 1 --replication-factor 1 --config retention.ms=2592000000
        $$T --bootstrap-server kafka:9092 --list

  migrate:
    build: ./backend
    command: ["python", "-m", "app.cli", "migrate"]
    healthcheck: { disable: true }
    env_file: .env
    environment: *backend_env
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    env_file: .env
    environment: *backend_env
    volumes: [artifacts:/app/var]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: ./backend
    command: ["python", "-m", "app.cli", "worker"]
    healthcheck: { disable: true }  # no HTTP server; liveness = process running (restart policy)
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    volumes: [artifacts:/app/var]  # shares model artifacts and uploads with the API
    depends_on:
      migrate: { condition: service_completed_successfully }
    stop_grace_period: 60s

  scorer:
    build: ./backend
    command: ["python", "-m", "app.cli", "stream-scorer"]
    healthcheck: { disable: true }
    restart: unless-stopped
    env_file: .env
    environment: *backend_env
    volumes: [artifacts:/app/var]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }
    stop_grace_period: 30s

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
  kafkadata:
  artifacts:
